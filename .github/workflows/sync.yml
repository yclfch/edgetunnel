name: Sync Fork

on:
  schedule:
    # 每周一北京时间 10:00
    # GitHub Actions 使用 UTC，这里是 02:00 UTC
    - cron: "0 2 * * 1"

  # 允许手动执行同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Sync main branch
        run: |
          git checkout main
          git merge upstream/main --ff-only
          git push origin main
